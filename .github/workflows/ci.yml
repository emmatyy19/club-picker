name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Data foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python and locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Test behavior
        run: uv run pytest --cov=club_picker --cov-report=term-missing

      - name: Build package
        run: uv build

      - name: Smoke test built wheel
        run: |
          uv venv --python 3.12 "${RUNNER_TEMP}/club-picker-smoke"
          uv pip install --python "${RUNNER_TEMP}/club-picker-smoke/bin/python" dist/*.whl
          "${RUNNER_TEMP}/club-picker-smoke/bin/python" -c "import club_picker"
          "${RUNNER_TEMP}/club-picker-smoke/bin/club-picker" template

  explorer:
    name: Local explorer checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
